name: Update Dashboard Data

on:
  schedule:
    # 06:00 KST (21:00 UTC prev day), 12:00 KST (03:00 UTC), 16:00 KST (07:00 UTC)
    - cron: '0 3,7,21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grant GitHub Actions bot permission to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python environment
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run spread.py script
        env:
          BOK_API_KEY: ${{ secrets.BOK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run spread.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.html *.csv *.xlsx
          # Only commit and push if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update dashboard data via GitHub Actions" && git push)
