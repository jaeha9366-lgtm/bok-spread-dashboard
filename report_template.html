<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>위탁운용 운용분석보고서</title>
<meta name="description" content="예금보험기금 위탁운용 펀드 주간·월간 운용분석보고서 (성과·BM 대비·요인분해·자금흐름·매매·환헤지)">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--bd:#e2e8f0;--tx:#0f172a;--mu:#64748b;--ac:#4f46e5;--ac2:#0ea5e9;--pos:#dc2626;--neg:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Inter','Malgun Gothic',sans-serif;font-size:14px}
.wrap{max-width:1280px;margin:0 auto;padding:2rem 1.5rem 4rem}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-family:'Outfit','Malgun Gothic',sans-serif;font-size:2rem;margin:0;color:var(--ac)}
.sub{color:var(--mu);margin-top:.35rem}
.badge{display:inline-block;background:#eef2ff;color:var(--ac);padding:.45rem 1rem;border-radius:999px;font-weight:600;font-size:.85rem}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:.5rem}
.tools{display:flex;gap:.5rem;justify-content:flex-end}
.tools button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:.45rem .9rem;border-radius:8px;font-weight:600;font-size:.82rem;cursor:pointer;transition:all .2s;font-family:inherit}
.tools button:hover{border-color:var(--ac);color:var(--ac)}
.tools button:disabled{opacity:.5;cursor:wait}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:.8rem 1rem;margin-bottom:.8rem}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden}
.seg button{border:0;background:#fff;padding:.5rem 1.1rem;font-weight:600;color:var(--mu);cursor:pointer;font-family:inherit;font-size:.88rem}
.seg button.on{background:var(--ac);color:#fff}
.controls select{padding:.48rem .7rem;border:1px solid var(--bd);border-radius:8px;font-family:inherit;font-size:.88rem;min-width:280px;background:#fff}
.controls .nav button{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:.45rem .7rem;cursor:pointer;font-weight:700;color:var(--mu)}
.controls .nav button:hover{color:var(--ac);border-color:var(--ac)}
.controls .info{color:var(--mu);font-size:.82rem;margin-left:auto}
.toc{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.2rem;position:sticky;top:0;background:var(--bg);padding:.5rem 0;z-index:5}
.toc a{text-decoration:none;color:var(--mu);background:var(--card);border:1px solid var(--bd);padding:.35rem .75rem;border-radius:8px;font-size:.8rem;font-weight:500}
.toc a:hover{color:var(--ac);border-color:var(--ac)}
section{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:1.5rem 1.7rem;margin-bottom:1.1rem;box-shadow:0 2px 10px rgba(15,23,42,.04)}
h2{font-family:'Outfit','Malgun Gothic',sans-serif;font-size:1.3rem;margin:0 0 1rem}
h2 span{color:var(--ac);margin-right:.4rem}
h3{font-size:1rem;margin:1.3rem 0 .6rem;color:#334155}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.8rem;margin-bottom:1.1rem}
.kpi{background:linear-gradient(135deg,#f8faff,#eef2ff);border:1px solid #e0e7ff;border-radius:12px;padding:.9rem 1rem}
.kl{color:var(--mu);font-size:.78rem;font-weight:600}
.kv{font-family:'Outfit','Malgun Gothic',sans-serif;font-size:1.55rem;font-weight:700;margin:.2rem 0}
.kv small{font-size:.8rem;margin-left:.2rem;color:var(--mu)}
.ks{color:var(--mu);font-size:.76rem}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.83rem;margin:.3rem 0 .8rem}
th{background:#f1f5f9;color:#475569;font-weight:600;padding:.5rem .55rem;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:.45rem .55rem;text-align:right;border-bottom:1px solid #f1f5f9;white-space:nowrap}
th.l,td.l{text-align:left}
td.wrap{white-space:normal}
tbody tr:hover td{background:#f8fafc}
tr.sum td{font-weight:700;background:#f8fafc;border-top:1px solid var(--bd)}
tr.grp td{background:#eef2ff;color:var(--ac);font-weight:700;text-align:left}
.pos{color:var(--pos)}.neg{color:var(--neg)}.muted{color:var(--mu)}
.tag{padding:.12rem .45rem;border-radius:6px;font-size:.72rem;font-weight:600;margin-left:.3rem}
.tag.new{background:#dcfce7;color:#15803d}.tag.end{background:#f1f5f9;color:#64748b}
.pts{line-height:1.85;padding-left:1.2rem;margin:.4rem 0}
.note{color:var(--mu);font-size:.77rem;margin-top:.3rem;line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
.grid2>*{min-width:0}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.chart{position:relative;height:300px;margin:.4rem 0 .8rem;min-width:0}
.chart.tall{height:340px}
.empty{color:var(--mu);padding:.8rem 0}
footer{color:var(--mu);font-size:.77rem;text-align:center;margin-top:2rem;line-height:1.7}
footer a{color:var(--ac)}
@media print{
  @page{size:A4;margin:12mm 10mm}
  body{background:#fff;font-size:10.5px}
  .wrap{max-width:none;padding:0}
  .toc,.tools,.controls{display:none!important}
  header{margin-bottom:.6rem;border-bottom:2px solid var(--ac);padding-bottom:.4rem}
  section{box-shadow:none;border:none;border-radius:0;padding:0;margin:0 0 .9rem}
  section.pb{break-before:page;page-break-before:always}
  h2,h3{break-after:avoid;page-break-after:avoid}
  table{font-size:.7rem}thead{display:table-header-group}
  td,th{padding:.25rem .3rem;white-space:normal}
  tr,.chart,.kpi,li{break-inside:avoid;page-break-inside:avoid}
  .tw{overflow:visible}
  .grid2{grid-template-columns:1fr 1fr;gap:.6rem}
  .chart{height:230px}.chart.tall{height:260px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* PDF 저장(html2pdf) 시 A4 본문 폭(756px)에 맞춤. 섹션은 이어서 배치하고 표 행·차트·카드는 쪼개지지 않게 처리 */
.pdf-mode{background:#fff!important}
.pdf-mode .wrap{width:756px!important;max-width:756px!important;padding:0 3px!important;margin:0!important}
.pdf-mode .toc,.pdf-mode .tools,.pdf-mode .controls{display:none!important}
.pdf-mode header{border-bottom:2px solid var(--ac);padding-bottom:.4rem;margin-bottom:.6rem}
.pdf-mode h1{font-size:1.5rem}
.pdf-mode section{box-shadow:none;border:0;border-top:1px solid #e2e8f0;border-radius:0;padding:.7rem 0 .2rem;margin:0}
.pdf-mode h2{font-size:1.1rem;margin-bottom:.5rem}
.pdf-mode h3{font-size:.88rem;margin:.6rem 0 .3rem}
.pdf-mode .tw{overflow:visible!important}
.pdf-mode table{table-layout:auto;font-size:.62rem}
.pdf-mode th,.pdf-mode td{padding:.22rem .22rem;white-space:normal}
.pdf-mode .kpis{grid-template-columns:repeat(3,1fr);gap:.4rem}
.pdf-mode .kpi{padding:.5rem .6rem}
.pdf-mode .kv{font-size:1.15rem}
.pdf-mode .grid2{grid-template-columns:1fr 1fr;gap:.6rem}
.pdf-mode .chart{height:230px}
.pdf-mode .pts{font-size:.76rem;line-height:1.55}
</style></head><body><div class="wrap">
<header>
  <div><h1>위탁운용 운용분석보고서</h1><div class="sub">예금보험기금 위탁운용 펀드 · 국내채권형 유니버스 / 일임 채권형 / 해외채권형</div></div>
  <div class="hright"><div class="badge" id="badge">-</div>
    <div class="tools"><button id="btnHwp" onclick="exportDocx()">📝 한글/워드 저장(.docx)</button><button id="btnPdf" onclick="exportPdf()">📄 PDF 저장</button><button id="btnPrint" onclick="window.print()">🖨️ 인쇄</button><button id="btnLock" onclick="window.__reportLock && window.__reportLock()" title="저장된 로그인 정보를 지우고 잠급니다">🔒 잠금</button></div>
  </div>
</header>
<div class="controls">
  <div class="seg" id="seg"><button data-k="W" class="on">주간 보고서</button><button data-k="M">월간 보고서</button></div>
  <select id="sel" aria-label="보고 기간"></select>
  <div class="nav"><button id="prev" title="이전 기간">◀</button> <button id="next" title="다음 기간">▶</button></div>
  <div class="info" id="info"></div>
</div>
<nav class="toc" id="toc"></nav>
<div id="report"></div>
<footer id="foot"></footer>
</div>
<script>window.REPORT_DATA = __REPORT_DATA__;</script>
<script src="report_app.js"></script>
<script src="report_export.js"></script>
</body></html>
