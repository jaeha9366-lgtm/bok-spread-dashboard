외환 15:30 종가, FRED DGS10)", "달러인덱스·엔/달러 값은 AI가 기사에서 찾은 종가 — 확인 필요", "[AI 확인 요청] 달러인덱스 종가는 10.16. 101.78, 10.23. 101.79~101.81(세부 101.791)로 매체별 소수점 둘째 자리 편차 확인 필요", "[AI 확인 요청] 엔/달러 종가는 10.16. 157.99~158.00엔, 10.23. 156.77~156.87엔으로 출처별 소수점 차이 확인 필요", "[AI 확인 요청] 10.20. 외국인 코스피 순매도 규모는 매체에 따라 1조 11억 원 또는 '약 5,000억~1조 원 대'로 기술되어 있어 확인 필요", "[AI 확인 요청] 11월 국고채 발행 계획 세부 수치는 기사 본문상 '미확인'으로 보고서 본문에서 제외함", "본문은 Gemini(gemini-3.8-flash 조사 / gemini-3.8-flash 작성)가 구글 검색 자료로 작성한 초안 — 사용 전 사실관계 확인 필요"], "sources": ["YouTube '미국 증시 요약' (2026.10.16) - 케빈 워시 연준 의장 신중론 및 9월 수입물가·산업생산 견조", "하나은행 외환 리포트 (2026.10.23) - 10월 S&P 제조업 PMI 및 소비자신뢰지수 발표", "TradingKey (2026.10.24) - CME FedWatch 10월 금리 동결 확률 90.6%", "Investing.com / 경제길잡이 (2026.10.23, 2026.10.26) - 메타 실적 쇼크 및 필라델피아 반도체 지수 폭락, WTI 103달러 돌파", "스페셜타임스 / 인포스탁데일리 (2026.10.21, 2026.10.23) - 외국인 국채선물 순매수 및 코스피 변동성", "머니스토리 / 매일경제 (2026.10.22, 2026.10.24) - 10월 한은 금통위 만장일치 기준금리 동결(3.00%) 및 신현송 총재 원화 저평가 발언", "클루좋은지식안내서 (2026.10.21) - 3.5조 원 국고채 바이백 응찰률 283.8%", "뉴스1 / 파이낸셜뉴스 (2026.10.20, 2026.10.23, 2026.10.25) - 일별 원/달러 환율 흐름 및 반도체 수출 네고 물량 영향", "IFC Markets / B.C.Aマネージメント (2026.10.23, 2026.10.26) - 달러인덱스 및 엔/달러 주간 종가 흐름", "검색 출처: alphasquare.co.kr", "검색 출처: kebhana.com", "검색 출처: note.com", "검색 출처: youtube.com", "검색 출처: tradingkey.com", "검색 출처: tistory.com", "검색 출처: investing.com", "검색 출처: moneygil.com", "검색 출처: stockbizview.com", "검색 출처: orangeboard.co.kr", "검색 출처: specialtimes.co.kr", "검색 출처: naver.com", "검색 출처: mk.co.kr", "검색 출처: kinfocenter.com", "검색 출처: news1.kr", "검색 출처: 38stock.co.kr", "검색 출처: hani.co.kr", "검색 출처: ifcmarkets.com", "검색 출처: chartexchange.com", "검색 출처: headtopics.com"], "research": "2026년 10월 16일 종가 대비 10월 23일 종가 주간(조사 범위: 10월 17일~10월 23일)의 금융시장 변동 요인을 조사하여 보고합니다. (공식 데이터 기준: 美 10년물 5.075% → 5.000%, 국고채 3년물 3.854% → 3.803%, 원/달러 1,331.4원 → 1,324.6원)\n\n---\n\n### 1. 미국 금리 (美 국채 10년물: 5.075% → 5.000%, △7.5bp)\n\n* **경제 지표 발표 (미국 현지 기준)**\n  * **10월 16일:** 9월 수입물가지수는 전월비 1.1%(예상 1.0%, 전월 0.7%), 9월 산업생산은 전월비 0.7%(예상 0.4%, 전월 0.0%)로 견조하게 발표됨. 직전 15일 발표된 9월 생산자물가지수(PPI) 역시 전월비 1.3%(전년비 6.3%, 근원 5.0%)로 예상치(0.5%)를 대폭 상회했음. [YouTube 채널 '미국 증시 요약', 2026.10.16 / 우리은행 Daily Forex, 2026.10.16]\n  * **10월 23일:** 10월 S&P 글로벌 제조업 PMI 속보치는 55.5(예상 55.5, 전월 55.9), 10월 미시간대 소비자신뢰지수 확정치는 46.3(예상 46.3, 직전 48.1)으로 발표됨. [하나은행 외환 리포트, 2026.10.23] 고용 부문에서는 10월 중순 주간 신규 실업수당 청구 건수가 19.9만 건(예상 20.0만 건)을 기록함. [note, 2026.10.19]\n* **FOMC 및 연준 인사 발언 / FedWatch 확률 변화**\n  * **10월 16일:** 케빈 워시 연준 의장이 미국 경제의 견조한 흐름을 평가하면서도 10월 FOMC(10/27~28) 정책 판단을 미리 예단하지 않겠다고 신중론을 표명하여 시장의 10월 추가 금리 인상 기대가 후퇴함. [note, 2026.10.19 / YouTube '미국 증시 요약', 2026.10.16]\n  * **10월 22일 기준:** CME FedWatch 툴에 따른 10월 FOMC 기준금리 동결 확률은 약 90.6%, 25bp 인상 확률은 약 9.4%로 집계됨. [TradingKey, 2026.10.24]\n* **국제 유가 급등세**\n  * 중동 지역 지정학적 긴장(사우디아라비아 시설 피격 우려 및 미·이란 갈등)으로 WTI 원유 선물은 주초 97달러 선에서 10월 23일 정산가 기준 배럴당 103.27달러(+3.8%)로 마감했으며, 브렌트유는 배럴당 116.72달러(+3.14%)까지 급등함. [Investing.com / 동글이대표, 2026.10.24]\n* **위험자산 흐름 및 안전자산 선호(Flight to Safety)**\n  * **10월 22일~23일:** 메타(Meta)가 3분기 실적에서 CAPEX(설비투자) 급증으로 잉여현금흐름(FCF)이 2012년 상장 후 14년 만에 마이너스(-21.2억 달러)로 전환했다고 발표한 뒤 주가가 약 7% 급락함. 필라델피아 반도체 지수(-6.72%)와 나스닥(-2.60%)이 폭락하며 빅테크 AI 인프라 부채 및 수익성 회의론이 글로벌 금융시장을 강타함. [Investing.com, 2026.10.26 / 경제길잡이, 2026.10.23]\n  * 이에 따라 주식시장에서 이탈한 자금이 안전자산인 미국 국채로 급격히 유입되며 미 국채 10년물 금리는 10월 21일 5.121%에서 10월 22일 종가 기준 4.955%로 하루 만에 16.6bp 급락(한 달 만에 5% 하회)한 뒤 10월 23일 5.000%로 마감함. [연합뉴스 / 시황 브리핑, 2026.10.23]\n* **국채 입찰**\n  * 해당 주간(10/17~23) 중 10년물·30년물 장기 국채 입찰은 없었음(직전 주인 10월 7일 10년물 5.300%, 10월 8일 30년물 5.618% 고금리 입찰 완료 후 비입찰 주간). [Investing.com, 2026.10.07 / 오렌지보드, 2026.10.09]\n\n---\n\n### 2. 한국 금리 (국고채 3년물: 3.854% → 3.803%, △5.1bp)\n\n* **외국인 국채선물 순매매 계약 수**\n  * **10월 16일:** 외국인은 3년 국채선물 13,683계약 순매수 (10년 국채선물 순매수 규모는 기사 본문상 세부 미확인). [개장체크, 2026.10.19]\n  * **10월 21일:** 외국인은 3년 국채선물 3,635계약 순매수(12거래일 연속 순매수 기록), 10년 국채선물 372계약 순매수 기록. [스페셜타임스, 2026.10.21]\n  * **10월 23일:** 외국인은 3년 국채선물 1,014계약 순매수, 10년 국채선물 3,584계약 순매수(은행도 3년 선물 4,932계약 순매수). [인포스탁데일리, 2026.10.23]\n* **한국은행 총재 및 금융통화위원회 (10월 22일)**\n  * **금통위 결정:** 기준금리를 연 3.00%로 7명 만장일치 동결함(7월·8월 각 25bp 연속 인상 후 점검). [머니스토리, 2026.10.22]\n  * **통화정책 기조:** 의결문에서 인하 가능성을 배제하고 긴축 기조를 지속하겠다고 밝힌 '매파적 동결'로 평가됨. 금통위원 6개월 조건부 금리 전망의 중간값은 3.25%로 추가 인상 가능성을 열어둠. [매일경제, 2026.10.22 / 정책 실사 보고서, 2026.10.25]\n  * **신현송 한은 총재 발언:** 기자간담회에서 \"최근 원화 절상은 비정상적 환율의 정상화 과정\"이라며 \"BIS 실효환율 기준(8월 말 89 안팎 vs 과거 평균 101)으로 원화는 여전히 상당폭 저평가돼 있어 추가 강세 여지가 충분하다\"고 명시함. [매일경제, 2026.10.24]\n* **국고채 발행 계획 및 재정 수급**\n  * **10월 21일:** 정부가 실시한 3조 5,000억 원 규모 국고채 바이백(매입)에 약 9조 9,000억 원이 응찰(응찰률 283.8%)하여 채권 수급 안정에 기여함. 세부 11월 국고채 발행 계획 발표치는 '미확인'. [클루좋은지식안내서, 2026.10.21]\n* **국내 증시 급변 및 채권 영향**\n  * **10월 19일:** 코스피 장초반 -3.17% 급락 후 반등(+1.76%, 5,768.01 마감). [달공이 주식, 2026.10.19]\n  * **10월 20일:** 코스피 3.73% 급락(5,552.74). [뉴스1, 2026.10.20]\n  * **10월 21일:** 코스피 3.29% 급등(5,735.66), 프로그램 매수 사이드카 발동(10시 51분). [EBN, 2026.10.21]\n  * **10월 22일:** 코스피 3.52% 급락(5,533.77). [홀로서기 라니팀, 2026.10.22]\n  * **10월 23일:** 코스피 장중 4%대 급락 후 반등(+0.30%, 5,550.30 마감). [인포스탁데일리, 2026.10.23]\n  * 증시의 극심한 일별 변동성과 주 후반 미 기술주 쇼크에 따른 안전자산 수요로 국고채 3년물 금리는 23일 3.803%까지 하락 마감함.\n\n---\n\n### 3. 원/달러 환율 (1,331.4원 → 1,324.6원, △6.8원)\n\n* **외국인 주식 순매매 (유가증권시장 기준)**\n  * **10월 19일:** 외국인 순매도 강도 완화 (일별 세부 수치는 매체별 '미확인'). [달공이 주식, 2026.10.19]\n  * **10월 20일:** 외국인 유가증권시장 1조 11억 원(약 5,000억~1조 원 대) 순매도. [뉴스1 / 38커뮤니케이션, 2026.10.20]\n  * **10월 21일:** 외국인 유가증권시장 약 6,600억 원 순매수. [EBN, 2026.10.21]\n  * **10월 22일:** 외국인 약 600억 원 순매수 (기관 1조 원대 순매도). [홀로서기 라니팀, 2026.10.22]\n  * **10월 23일:** 외국인 유가증권시장 9,941억 원 순매도. [뉴스1, 2026.10.23]\n* **수출입업체 수급**\n  * 반도체 수출 호황(10월 1~20일 수출 중 반도체 비중 44.6%, 일평균 수출 47.4억 달러)에 힘입어 삼성전자·SK하이닉스 등 대형 수출업체의 대규모 달러 매도(네고) 물량이 지속 출회됨. 수입업체의 저가 결제 수요와 외국인 주식 매도 환전 수요를 상쇄하며 환율의 일방적 하향 압력으로 작용함. [뉴스1 / 파이낸셜뉴스, 2026.10.25]\n* **일별 급등락 원인 및 장중 흐름**\n  * **10월 19일(1,330.3원, -1.1원):** 반도체 수출 대금 유입으로 2024년 10월 2일(1,319.3원) 이후 최저치 경신. [한겨레, 2026.10.20]\n  * **10월 20일(1,328.1원, -2.2원):** 프랑스 재정불안 발 글로벌 달러 강세와 코스피 3.73% 급락 및 외인 1조 원 매도에도 불구하고, 반도체 네고 물량과 외인 달러선물 매도로 2년여 만에 종가 1,330원 하회(장중 저점 1,325.4원). [뉴스1, 2026.10.20]\n  * **10월 21일(1,325.2원, -2.9원):** 코스피 3.3% 급반등 및 외국인 매수 복귀, 지속적인 수출 네고 출회로 연저점 연속 경신. [클루좋은지식안내서, 2026.10.21]\n  * **10월 22일(1,324.2원, -1.0원):** 금통위 기준금리 동결 직후 신현송 한은 총재의 \"원화 실효환율 저평가\" 발언으로 5거래일 연속 연저점 경신(종가 기준 2024년 10월 이후 최저치). [매일경제, 2026.10.24]\n  * **10월 23일(1,324.6원, +0.4원):** 美 AI 기술주 폭락, 유가 급등, 외인 증시 1조 원 매도로 장중 1,321.2원까지 내린 후 6거래일 만에 소폭 반등 마감(단, 수출 네고로 상승폭 0.4원에 그침). [뉴스1, 2026.10.23]\n\n---\n\n### 4. 달러인덱스(DXY) 및 엔/달러 종가\n\n* **달러인덱스 (DXY) 종가**\n  * **2026년 10월 16일:** 101.78 (세부 101.779) [IFC Markets / note, 2026.10.19]\n  * **2026년 10월 23일:** 101.79~101.81 (세부 101.791) [IFC Markets / Investing.com, 2026.10.23]\n* **엔/달러 (USD/JPY) 종가**\n  * **2026년 10월 16일:** 157.99~158.00엔 (157.997엔) [ChartExchange / 우리은행 Daily Forex, 2026.10.16]\n  * **2026년 10월 23일:** 156.77~156.87엔 (장중 저점 156.06~156.08엔 형성 후 반등) [Investing.com / B.C.Aマネージメント, 2026.10.26]\n\n---\n\n### [주간 변동을 가장 잘 설명하는 핵심 동인]\n\n* **미국 금리:** 빅테크(메타 등) 실적 발표에 따른 AI 인프라 부채 및 수익성 쇼크가 기술주 폭락을 부르며 글로벌 안전자산 선호(Flight to Safety) 채권 매수세를 촉발함.\n* **한국 금리:** 한은 금통위의 '매파적 동결' 경계감 속에서도 미 국채금리 급락과 국내 3.5조 원 바이백 호조, 외국인의 국채선물 순매수 지속이 금리 하락을 견인함.\n* **원/달러 환율:** 외국인의 대규모 주식 순매도와 위험회피 심리에도 불구하고, 반도체 슈퍼호황에 따른 막대한 수출 네고(달러 매도) 물량과 한은 총재의 '원화 저평가' 발언이 하방 압력을 지배함.\n* **달러인덱스·엔/달러:** 달러인덱스는 프랑스 재정 불안(유로 약세)과 미 금리 하락이 팽팽히 맞서며 101.8선에 횡보한 반면, 엔/달러는 글로벌 위험회피 및 미 금리 급락에 따른 엔화 매수세로 156엔대로 하락함.", "docx": "261023_금융시장_주간_동향_및_운용계획.docx", "rid": "weekly-261023", "images": ["iVBORw0KGgoAAAANSUhEUgAAAd0AAAEWCAYAAAAjEk0ZAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAPYQAAD2EBqD+naQAAQGdJREFUeJzt3Xd4VFXCBvB3+mQmlRAIJSRAwEBA6U1AAUUQcRVxVWwgRcXggsLiWlB3VT4LolhYWAuKwgp2XUQEIZRQQqiBAAESAqmkl+lzz/dHyCVDMiGBZCYJ7+95eMg99545Z5KZeeeee+69CiGEABERETU4pbc7QEREdK1g6BIREXkIQ5eIiMhDGLpEREQewtAlIiLyEIYuERGRhzB0iYiIPIShS0RE5CEMXSIiIg9Re7sDRERE7litVhQUFMjLBoMB/v7+brc/f/48jEYjDAaDXFZaWgq9Xg+12jXy3JU3JIYuERE1WkeOHMFHH30       ${para('미국금리', t.us, c.us_chg)}${para('한국금리', t.kr, c.kr_chg)}${para('원/달러 환율', t.fx, c.fx_chg)}
      <div class="summ">${summ}</div>
      <p class="meta">운용 계획 기간: ${esc(c.plan_period)} · 신규운용 현황·수익률·차주계획(운용가능 자금 등) 칸은 한글 파일에서 확인</p>`;
  }
  function render() {
    seg();
    const list = D.reports.filter((r) => r.type === type);
    if (!list.length) {
      $('#view').innerHTML = `<section><h2>${esc(D.types[type])}</h2><div class="empty">아직 등록된 보고서가 없습니다.<br>
        주간 보고서는 오른쪽 위 '📤 자료 업로드'로 엑셀을 올리면 자동 작성됩니다. 월간·연간은 Antigravity에 작성을 요청해 주세요. 필요한 자료:<ul>${NEED[type].map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div></section>`;
      return;
    }
    const r = list[idx];
    const opts = list.map((x, i) => `<option value="${i}" ${i === idx ? 'selected' : ''}>${esc((x.calc && x.calc.title) || x.file)}</option>`).join('');
    const warn = (r.data_notes && r.data_notes.length) ? `<div class="warn"><b>데이터 확인 사항</b><ul>${r.data_notes.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '';
    const src = (r.sources && r.sources.length) ? `<h3>참고 자료</h3><div class="src">${r.sources.map((x) => esc(x)).join('<br>')}</div>` : '';
    $('#view').innerHTML = `<div class="bar"><select id="sel">${opts}</select><span class="meta">작성 ${esc(r.created)}</span>
      <button class="dl" id="dl">📥 한글 파일(HWPX) 다운로드</button>${r.docx ? '<button class="dl dl2" id="dlw">📄 워드 파일(DOCX) 다운로드</button>' : ''}</div>
      <section><h2>${esc((r.calc && r.calc.title) || r.file)}</h2><p class="meta">기준일 ${esc(r.calc ? r.calc.base : '')} · ${esc(r.file)}</p>
      ${warn}${type === 'weekly' && r.calc ? weekly(r) : ''}${src}</section>`;
    $('#sel').onchange = (e) => { idx = +e.target.value; render(); };
    $('#dl').onclick = () => download(r, 'hwpx', $('#dl'));
    if (r.docx) $('#dlw').onclick = () => download(r, 'docx', $('#dlw'));
  }
  async function download(r, ext, btn) {
    const label = btn.textContent;
    const mime = ext === 'docx' ? 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' : 'application/hwp+zip';
    try {
      btn.disabled = true; btn.textContent = '⏳ 준비 중...';
      const res = await fetch(`trend_files/${r.rid}.${ext}?v=${encodeURIComponent(r.created)}`);
      if (!res.ok) throw new Error('파일을 불러오지 못했습니다 (' + res.status + ')');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([await res.arrayBuffer()], { type: mime }));
      a.download = ext === 'docx' ? r.docx : r.file; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch (e) {
      alert('다운로드 실패: ' + (e.message || e) + (location.protocol === 'file:' ? '\n(로컬 파일에서는 브라우저가 파일 읽기를 막을 수 있습니다. 사이트 주소로 접속해 주세요.)' : ''));
    } finally {
      btn.disabled = false; btn.textContent = label;
    }
  }
  $('#gen').textContent = '게시 ' + D.gen + ' · 보고서 본문은 AI가 공개 자료를 조사해 작성한 초안이므로 사실관계를 확인한 뒤 사용하세요.';
  render();
})();
</script>
<script src="trend_upload.js"></script>
</body></html>
